<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Reverse Image Search</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <div class="logo">
            VISION Search
        </div>

        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#result">result</a></li>
            <li><a href="index.HTML">About ME</a></li>
            
        </ul>
    </nav>

    <!-- Hero Section -->

    <section class="hero">

        <h1>VISION Search</h1>

        <p>
            Upload an image to identify objects and gather related information.
        </p>

    </section>

    <!-- Upload Box -->

    <section class="upload-section">

        <div class="upload-box">

            <input type="file" id="imageInput" accept="image/*">

            <img id="preview" src="" alt="Preview">

            <button id="analyzeBtn">
                Analyze Image
            </button>

        </div>

    </section>

    <!-- Result Section -->

    <section class="result">

        <h2>Result</h2>

        <div id="resultBox">

            Waiting for image...

        </div>

    </section>

    <!-- Footer -->

    <footer>

        © 2026 AI Reverse VISION Search

    </footer>

<!--JAVA SCRIPT-->

<script src="script.js">
</script>

</body>
</html>
